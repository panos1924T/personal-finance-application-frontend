<section class="login-page">
  <h1>Sign in</h1>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <label>
      Email
      <input type="email" formControlName="email">
    </label>

    <label>
      Password
      <input type="password" formControlName="password">
    </label>

    <button type="submit" [disabled]="loginForm.invalid">
      Sign in
    </button>

  </form>
</section>
