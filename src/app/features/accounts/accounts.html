<section class="accounts-page">

  <header class="page-header">
    <div>
      <h1>Accounts</h1>
      <p>Manage your accounts and balances</p>
    </div>
  </header>

  <app-account-form
    (accountCreated)="onAccountCreated($event)">
  </app-account-form>

  <section class="accounts-groups">

    @for (type of accountTypes; track type) {

      @if (getAccountsByType(type).length > 0) {

        <section class="account-group">

          <h2>{{ type }}</h2>

          <div class="accounts-list">

            @for (account of getAccountsByType(type); track account.uuid) {

              <article class="account">

                <div class="account-info">
                  <strong>{{ account.name }}</strong>
                  <span>{{ account.accountType }}</span>
                </div>

                <div class="account-actions">
                  <strong>€{{ account.balance }}</strong>

                  <button
                    type="button"
                    (click)="onDeleteAccount(account.uuid)">
                    Delete
                  </button>
                </div>

              </article>

            }

          </div>

        </section>

      }

    }

  </section>

</section>
